spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:file:./data/dinora_db
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080

